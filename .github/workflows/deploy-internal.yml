name: Deploy internal (private.bettermachine.ai)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-internal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BETTERMACHINE_DEPLOY_HOST }}
          username: ${{ secrets.BETTERMACHINE_DEPLOY_USER }}
          key: ${{ secrets.BETTERMACHINE_DEPLOY_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.BETTERMACHINE_DEPLOY_PATH }}"
            PM2_NAME="${{ secrets.BETTERMACHINE_PM2_NAME }}"

            echo "=== sanity ==="
            pwd
            whoami

            cd "$DEPLOY_PATH"

            echo "=== git pull (master) ==="
            git fetch origin
            git reset --hard origin/master

            echo "=== write .env.local (if missing) ==="
            if [ ! -f apps/internal/.env.local ]; then
              cat > apps/internal/.env.local <<'ENVEOF'
            ADMIN_BASIC_AUTH_USER=${{ secrets.ADMIN_BASIC_AUTH_USER }}
            ADMIN_BASIC_AUTH_PASS=${{ secrets.ADMIN_BASIC_AUTH_PASS }}
            GITHUB_DISPATCH_TOKEN=${{ secrets.BETTERMACHINE_DISPATCH_TOKEN }}
            ENVEOF
              chmod 600 apps/internal/.env.local
            else
              echo "(apps/internal/.env.local already exists, not overwriting)"
            fi

            echo "=== run DB migration ==="
            cd apps/internal
            node migrate.cjs

            echo "=== install (workspace-aware) ==="
            cd ../..
            npm ci --workspaces --include-workspace-root

            echo "=== build @bm/internal ==="
            cd apps/internal
            npm run build

            echo "=== restart process ==="
            if pm2 list 2>/dev/null | grep -q "$PM2_NAME"; then
              pm2 restart "$PM2_NAME" --update-env
            elif systemctl list-units --type=service --no-legend | grep -q "$PM2_NAME"; then
              sudo systemctl restart "$PM2_NAME"
            else
              echo "ERROR: process '$PM2_NAME' not found in pm2 or systemd"
              exit 1
            fi

            echo "=== smoke test ==="
            sleep 5
            curl -fsS -o /dev/null -w "pmo:        %{http_code}\n" http://localhost:3000/pmo || true
            curl -sI http://localhost:3000/internal/admin 2>&1 | head -1
            curl -fsS -o /dev/null -w "api/audit:  %{http_code}\n" http://localhost:3000/api/audit || true

            echo "=== deploy complete ==="

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Internal deploy to bettermachine-host failed. Check the Actions log."

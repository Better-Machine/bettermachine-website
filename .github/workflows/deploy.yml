name: Deploy bettermachine.ai

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BETTERMACHINE_DEPLOY_HOST }}
          username: ${{ secrets.BETTERMACHINE_DEPLOY_USER }}
          key: ${{ secrets.BETTERMACHINE_DEPLOY_KEY }}
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.BETTERMACHINE_DEPLOY_PATH }}"
            PM2_NAME="${{ secrets.BETTERMACHINE_PM2_NAME }}"

            cd "$DEPLOY_PATH"

            echo "=== git pull ==="
            git pull origin master

            echo "=== run DB migration ==="
            cd web
            node migrate.cjs

            echo "=== write .env.local (if missing) ==="
            if [ ! -f .env.local ]; then
              cat > .env.local <<'ENVEOF'
            ADMIN_BASIC_AUTH_USER=${{ secrets.ADMIN_BASIC_AUTH_USER }}
            ADMIN_BASIC_AUTH_PASS=${{ secrets.ADMIN_BASIC_AUTH_PASS }}
            ENVEOF
              chmod 600 .env.local
            else
              echo "(.env.local already exists, not overwriting)"
            fi

            echo "=== restart process ==="
            if pm2 list | grep -q "$PM2_NAME"; then
              pm2 restart "$PM2_NAME"
            elif systemctl list-units --type=service --no-legend | grep -q "$PM2_NAME"; then
              sudo systemctl restart "$PM2_NAME"
            else
              echo "ERROR: process '$PM2_NAME' not found in pm2 or systemd"
              exit 1
            fi

            echo "=== smoke test ==="
            sleep 5
            curl -fsS -o /dev/null -w "homepage: %{http_code}\n" http://localhost:3000/ || true
            curl -sI http://localhost:3000/internal/admin 2>&1 | head -1
            curl -sI http://localhost:3000/pmo 2>&1 | head -1

            echo "=== deploy complete ==="

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy to bettermachine-host failed. Check the Actions log."
